name: "🐛 Bug Report"
description: Report a reproducible bug after checking the README.
title: "[Issue]: "
assignees: []
body:
  - type: checkboxes
    id: required-checks
    attributes:
      label: "⚠️ Step 1: Required Checks"
      description: "Please check all boxes."
      options:
        - label: >-
            I have **read the** [**README**](https://github.com/8bit2qubit/OmniConsole?tab=readme-ov-file#readme), including the **Prerequisites** and **Quick Start** sections.
          required: true
        - label: >-
            I have searched the [**existing Issues**](https://github.com/8bit2qubit/OmniConsole/issues) to ensure my problem is not already reported.
          required: true
        - label: >-
            I understand this template is for **reproducible bugs only**. If this is a feature request, I am aware that the **source code is available** and I can build and implement it myself locally.
          required: true
        - label: >-
            I have checked that this bug is **specific to OmniConsole** — it is not a quirk of **Xbox Mode (FSE)**, the gaming platform itself (Steam, Xbox App, etc.), or a recent **Windows update**.
          required: true
        - label: >-
            I understand that OmniConsole is a **personal interest project**, written and maintained by a **solo developer** in their own free time. I have considered whether this bug report is **realistic** for a project of that scope before opening this.
          required: true
        - label: >-
            I have **sanity-checked** this from the maintainer's side: it is a **real, reproducible bug**, not something that would make a tired hobbyist developer reach for more coffee.
          required: true
  - type: markdown
    attributes:
      value: "---"
  - type: markdown
    attributes:
      value: "### 📋 Step 2: Your Environment"
  - type: dropdown
    id: pc-type
    attributes:
      label: "1. What is your PC Type?"
      options:
        - Desktop
        - Laptop
        - Handheld
    validations:
      required: true
  - type: input
    id: pc-model
    attributes:
      label: "PC Model"
      description: '(e.g., ROG Xbox Ally X, or "Custom-built Desktop")'
      placeholder: "Type here..."
    validations:
      required: true
  - type: input
    id: os-build
    attributes:
      label: "2. What is your full Windows OS Build number?"
      description: "(Start > Settings > System > About)"
      placeholder: "e.g., 26200.7019"
    validations:
      required: true
  - type: dropdown
    id: default-platform
    attributes:
      label: "3. Which default gaming platform have you configured?"
      options:
        - Steam Big Picture
        - Xbox App
        - Epic Games Store
        - Armoury Crate SE
        - Playnite Fullscreen
        - Custom Platform
    validations:
      required: true
  - type: dropdown
    id: tool-version
    attributes:
      label: "4. Which OmniConsole version are you using?"
      options:
        - v2.9.0.0
        - v2.7.0.0
        - v2.5.2.0
        - v2.5.1.0
        - v2.5.0.0
        - v2.1.1.0
        - v2.1.0.0
        - v2.0.0.0
        - v1.9.0.0
        - v1.8.1.0
        - v1.8.0.0
        - v1.7.1.0
        - v1.7.0.0
        - v1.6.0.0
        - v1.5.0.0
        - v1.4.5.0
        - v1.4.4.0
        - v1.4.3.0
        - v1.4.2.0
        - v1.4.1.0
        - v1.4.0.0
        - v1.3.2.0
        - v1.3.1.0
        - v1.3.0.0
        - v1.2.0.0
        - v1.1.0.0
        - v1.0.5.0
        - v1.0.4.0
        - v1.0.3.0
        - v1.0.2.0
        - v1.0.0.0
        - v0.9.3.0
        - v0.9.2.0
        - v0.9.1.0
        - v0.9.0.0
        - v0.8.0.0
        - v0.7.1.0
        - v0.7.0.0
        - v0.6.0.0
        - v0.5.0.0
        - v0.4.0.0
        - v0.3.0.0
        - v0.2.0.0
        - v0.1.6.0
        - v0.1.5.0
        - v0.1.4.0
        - v0.1.3.0
        - v0.1.2.0
        - v0.1.1.0
        - v0.1.0.0
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"
  - type: markdown
    attributes:
      value: "### 📝 Step 3: Bug Details"
  - type: textarea
    id: issue-description
    attributes:
      label: "5. Describe the bug:"
      description: "(A clear and concise description of what the bug is. Screenshots, a short clip, or relevant logs are welcome here — a picture often shows the problem more precisely than words.)"
      placeholder: "Type here..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "6. Steps to Reproduce:"
      description: "(List the exact steps that reproduce the bug. A short screen recording can capture this better than text.)"
      placeholder: |
        1. Boot the PC / Press Xbox button.
        2. Observed ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: without-omniconsole
    attributes:
      label: "7. Does the problem still happen with the default Xbox App shell?"
      description: "(Open **Settings → Gaming → Xbox mode (FSE)** and set **Choose home app** from OmniConsole back to the Xbox App, then try to reproduce the problem. This keeps the Xbox Mode (FSE) environment unchanged and only swaps out the shell. If the problem still happens, the root cause is Xbox Mode (FSE), the platform, or Windows rather than OmniConsole. Describe what you observed.)"
      placeholder: "e.g., Set the home app back to the Xbox App — the problem still happens / no longer happens / not tested."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "8. Expected Behavior:"
      description: "(What did you expect to happen? A reference screenshot, if you have one, helps.)"
      placeholder: "Type here..."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "9. Actual Behavior:"
      description: "(What actually happened? A screenshot or clip of the result makes this clearer.)"
      placeholder: "Type here..."
    validations:
      required: true
  - type: textarea
    id: environment-snapshot
    attributes:
      label: "10. Environment Snapshot"
      description: >-
        Paste the **full Markdown snapshot** here — it carries the OS build, FSE state, XFSET status, and hardware details needed to diagnose and analyze the problem. **PhantomKey only runs inside the Xbox Mode (FSE) shell — capture the snapshot from inside FSE, while PhantomKey is running; a snapshot taken from the desktop will always show "PhantomKey: not running" and isn't useful for diagnosis.** Get it via **OmniConsole Settings → navigation button (☰) → About → Copy to Clipboard**.
      placeholder: "Paste your Markdown snapshot here..."
    validations:
      required: true
  - type: checkboxes
    id: snapshot-confirm
    attributes:
      label: "Environment Snapshot — confirmation"
      options:
        - label: >-
            What I pasted above is the **actual** environment snapshot — **not** "n/a", "N/A", or a hand-written summary. I understand that issues without a valid environment snapshot will be closed.
          required: true
